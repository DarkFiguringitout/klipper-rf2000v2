# =====================================================================
#  Input shaping: ADXL345 on the Raspberry Pi SPI + Klippain Shake&Tune
#  NOT included by default - Shake&Tune stops Klipper from starting if
#  [resonance_tester] (and so a working accelerometer) is missing.
#
#  1. Wire the ADXL345 to the Pi header and mount it on the hotend holder:
#       3V3 -> pin 1, GND -> pin 6, SDA/SDI -> pin 19 (MOSI),
#       SDO -> pin 21 (MISO), SCL -> pin 23 (SCLK), CS -> pin 24 (CE0)
#  2. sudo raspi-config nonint do_spi 0 && sudo reboot
#  3. Klipper host MCU (https://www.klipper3d.org/RPi_microcontroller.html):
#       cd ~/klipper && make menuconfig   (Linux process), make flash,
#       sudo cp scripts/klipper-mcu.service /etc/systemd/system/ &&
#       sudo systemctl enable --now klipper-mcu
#  4. Shake&Tune: docs/04-first-start.md step 12 (already done if the
#     Shake&Tune repo is in ~/klippain_shaketune)
#  5. printer.cfg: [include rf2000v2/optional/adxl345_shaketune.cfg],
#     FIRMWARE_RESTART, ACCELEROMETER_QUERY must print values
#
#  The bed only moves in Z, so one sensor on the hotend holder measures
#  both X and Y.
# =====================================================================
[mcu rpi]
serial: /tmp/klipper_host_mcu

[adxl345]
cs_pin: rpi:None
spi_bus: spidev0.0

[resonance_tester]
accel_chip: adxl345
# bed center, 20 mm above the bed
probe_points: 85, 145, 20

[shaketune]
# result_folder: ~/printer_data/config/ShakeTune_results
# number_of_results_to_keep: 10
