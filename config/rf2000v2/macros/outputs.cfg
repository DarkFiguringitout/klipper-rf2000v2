# =====================================================================
#  RF2000v2 RGB light effects, outputs, keys, drivers
# =====================================================================

# ---------------------------------------------------------------------
#  RGB light (RF fw FEATURE_RGB_LIGHT_EFFECTS, M3303..M3308)
#  Modes: OFF, WHITE, AUTO (heating/printing/cooling/idle colours), MANUAL
# ---------------------------------------------------------------------
[gcode_macro RGB_LIGHT]
description: RGB light mode MODE=OFF|WHITE|AUTO|MANUAL [R= G= B= 0..255]
variable_mode: "WHITE"
variable_state: ""
variable_tolerance: 5.0
variable_heating: [255, 0, 0]
variable_printing: [255, 255, 255]
variable_cooling: [0, 0, 255]
variable_idle: [255, 255, 255]
variable_manual: [128, 128, 255]
gcode:
  {% set sv = printer.save_variables.variables %}
  {% set m = params.MODE|default(sv.rgb_mode|default(mode))|upper %}
  {% if m not in ["OFF", "WHITE", "AUTO", "MANUAL"] %}
    {action_raise_error("MODE must be OFF, WHITE, AUTO or MANUAL")}
  {% endif %}
  {% if params.R is defined or params.G is defined or params.B is defined %}
    {% set c = [params.R|default(manual[0])|int, params.G|default(manual[1])|int, params.B|default(manual[2])|int] %}
    SET_GCODE_VARIABLE MACRO=RGB_LIGHT VARIABLE=manual VALUE="{c}"
    SAVE_VARIABLE VARIABLE=rgb_manual VALUE="{c}"
  {% endif %}
  SET_GCODE_VARIABLE MACRO=RGB_LIGHT VARIABLE=mode VALUE='"{m}"'
  SET_GCODE_VARIABLE MACRO=RGB_LIGHT VARIABLE=state VALUE='""'
  SAVE_VARIABLE VARIABLE=rgb_mode VALUE='"{m}"'
  UPDATE_DELAYED_GCODE ID=_RGB_LIGHT_LOOP DURATION=0.1

[gcode_macro _RGB_SET]
gcode:
  SET_LED LED=rgb RED={params.R|float / 255.0} GREEN={params.G|float / 255.0} BLUE={params.B|float / 255.0}

[gcode_macro _RGB_COLOR]
description: Configure the colour of an RGB light state (RF M3303..M3307)
gcode:
  {% set name = params.STATE|lower %}
  {% set cur = printer["gcode_macro RGB_LIGHT"][name] %}
  {% set c = [params.R|default(cur[0])|int, params.G|default(cur[1])|int, params.B|default(cur[2])|int] %}
  SET_GCODE_VARIABLE MACRO=RGB_LIGHT VARIABLE={name} VALUE="{c}"
  SAVE_VARIABLE VARIABLE=rgb_{name} VALUE="{c}"
  SET_GCODE_VARIABLE MACRO=RGB_LIGHT VARIABLE=state VALUE='""'

[delayed_gcode _RGB_LIGHT_LOOP]
initial_duration: 2.0
gcode:
  {% if printer.webhooks.state != "shutdown" %}
  {% set rgb = printer["gcode_macro RGB_LIGHT"] %}
  {% set sv = printer.save_variables.variables %}
  {% set mode = sv.rgb_mode|default(rgb.mode)|upper %}
  {% set heaters = ["extruder", "extruder1", "heater_bed"] %}
  {% set ns = namespace(heating=False, hot=False, active=False) %}
  {% for h in heaters %}
    {% if h in printer %}
      {% set hs = printer[h] %}
      {% if hs.target > 0 %}
        {% set ns.active = True %}
        {% if hs.temperature < hs.target - rgb.tolerance %}
          {% set ns.heating = True %}
        {% endif %}
      {% elif hs.temperature > 50 %}
        {% set ns.hot = True %}
      {% endif %}
    {% endif %}
  {% endfor %}
  {% if mode == "OFF" %}
    {% set st = "off" %}{% set c = [0, 0, 0] %}
  {% elif mode == "WHITE" %}
    {% set st = "white" %}{% set c = [255, 255, 255] %}
  {% elif mode == "MANUAL" %}
    {% set st = "manual" %}{% set c = sv.rgb_manual|default(rgb.manual) %}
  {% elif ns.heating %}
    {% set st = "heating" %}{% set c = sv.rgb_heating|default(rgb.heating) %}
  {% elif printer.print_stats.state == "printing" or ns.active %}
    {% set st = "printing" %}{% set c = sv.rgb_printing|default(rgb.printing) %}
  {% elif ns.hot %}
    {% set st = "cooling" %}{% set c = sv.rgb_cooling|default(rgb.cooling) %}
  {% else %}
    {% set st = "idle" %}{% set c = sv.rgb_idle|default(rgb.idle) %}
  {% endif %}
  {% if st != rgb.state %}
    _RGB_SET R={c[0]} G={c[1]} B={c[2]}
    SET_GCODE_VARIABLE MACRO=RGB_LIGHT VARIABLE=state VALUE='"{st}"'
  {% endif %}
  UPDATE_DELAYED_GCODE ID=_RGB_LIGHT_LOOP DURATION=2

# ---------------------------------------------------------------------
#  Outputs (RF fw M3300 / M3301 / M3120 / M3121)
# ---------------------------------------------------------------------
  {% endif %}

[gcode_macro SET_MAINS_OUTPUT]
description: Switch the 230V socket (S=0/1)
gcode:
  SET_PIN PIN=output_230v VALUE={1 if params.S|default(1)|int else 0}

[gcode_macro SET_FET]
description: Switch a 24V FET output (P=1 X42, P=2 X44, S=0/1)
gcode:
  {% set p = params.P|default(1)|int %}
  {% set s = 1 if params.S|default(1)|int else 0 %}
  {% if p == 1 %}
    SET_PIN PIN=fet1_x42 VALUE={s}
  {% elif p == 2 %}
    SET_PIN PIN=fet2_x44 VALUE={s}
  {% elif p == 3 %}
    RESPOND TYPE=error MSG="FET3 (X45) is used by the case fan (controller_fan case_fan)"
  {% else %}
    {action_raise_error("P must be 1, 2 or 3")}
  {% endif %}

# ---------------------------------------------------------------------
#  Stepper currents (RF fw motor current menu / M3920 silent mode)
# ---------------------------------------------------------------------
[gcode_macro RF_SILENT_MODE]
description: Toggle between factory and silent stepper currents (S=0/1)
variable_silent: 0
variable_factory: {"stepper_x": 145, "stepper_y": 140, "stepper_z": 100, "extruder": 90, "extruder1": 90}
# community firmware MOTOR_CURRENT_NORMAL
variable_quiet: {"stepper_x": 110, "stepper_y": 110, "stepper_z": 105, "extruder": 90, "extruder1": 90}
gcode:
  {% set s = params.S|default(1 - silent)|int %}
  {% set table = quiet if s else factory %}
  {% for name, torque in table.items() %}
    SET_DRV_CURRENT STEPPER={name} TORQUE={torque}
  {% endfor %}
  SET_GCODE_VARIABLE MACRO=RF_SILENT_MODE VARIABLE=silent VALUE={s}
  RESPOND MSG="Stepper currents: {'silent' if s else 'factory'}"

# Project command (not an RF firmware code): shortcut for RF_SILENT_MODE
[gcode_macro M3920]
description: Silent mode shortcut (M3920 S1 on / S0 off) - not an RF fw code
gcode:
  RF_SILENT_MODE S={params.S|default(1)}

[gcode_macro RF_DRIVER_FAULT]
description: Called when FAULTn goes low - pauses only on a real driver fault
gcode:
  {% for s in ["stepper_x", "stepper_y", "stepper_z", "extruder", "extruder1"] %}
    DRV_STATUS STEPPER={s}
  {% endfor %}
  _RF_DRIVER_FAULT_CHECK

[gcode_macro _RF_DRIVER_FAULT_CHECK]
gcode:
  {% set ns = namespace(f=[]) %}
  {% for s in ["stepper_x", "stepper_y", "stepper_z", "extruder", "extruder1"] %}
    {% set f = printer["drv8711 " ~ s].faults %}
    {% if f %}
      {% set ns.f = ns.f + [s ~ " " ~ f|join("+")] %}
    {% endif %}
  {% endfor %}
  {% if ns.f %}
    RESPOND TYPE=error MSG="DRV8711 driver fault detected: {ns.f|join(' ')}"
    {% if printer.print_stats.state == "printing" %}
      PAUSE
    {% endif %}
  {% else %}
    RESPOND MSG="DRV8711 FAULTn low without OTS/OCP/PDF (UVLO/stall info only) - ignored"
  {% endif %}

[gcode_macro DRV_STATUS_ALL]
description: Report the status register of all five DRV8711 drivers
gcode:
  {% for s in ["stepper_x", "stepper_y", "stepper_z", "extruder", "extruder1"] %}
    DRV_STATUS STEPPER={s} CLEAR={params.CLEAR|default(0)}
  {% endfor %}

# ---------------------------------------------------------------------
#  Front panel keys
# ---------------------------------------------------------------------
[gcode_macro RF_KEY_RIGHT]
description: Front panel RIGHT key - toggles the case light by default
gcode:
  {% set w = printer["led case_light"].color_data[0][3] %}
  SET_LED LED=case_light WHITE={0 if w > 0 else 1}

[gcode_macro RF_KEY_HOLD]
description: Start a hold-to-repeat key action
variable_key: ""
variable_count: 0
variable_interval: 0.15
# Z step per repeat; grows while the key is held (RF fw speed dependent
# positioning) up to z_step_max
variable_z_step: 0.1
variable_z_step_max: 2.0
variable_babystep: 0.01
variable_e_step: 1.0
gcode:
  SET_GCODE_VARIABLE MACRO=RF_KEY_HOLD VARIABLE=key VALUE='"{params.KEY}"'
  SET_GCODE_VARIABLE MACRO=RF_KEY_HOLD VARIABLE=count VALUE=0
  _RF_KEY_ACTION KEY={params.KEY}
  UPDATE_DELAYED_GCODE ID=_RF_KEY_REPEAT DURATION=0.5

[gcode_macro RF_KEY_RELEASE]
gcode:
  SET_GCODE_VARIABLE MACRO=RF_KEY_HOLD VARIABLE=key VALUE='""'
  UPDATE_DELAYED_GCODE ID=_RF_KEY_REPEAT DURATION=0

[delayed_gcode _RF_KEY_REPEAT]
gcode:
  {% set k = printer["gcode_macro RF_KEY_HOLD"] %}
  {% if k.key %}
    SET_GCODE_VARIABLE MACRO=RF_KEY_HOLD VARIABLE=count VALUE={k.count + 1}
    _RF_KEY_ACTION KEY={k.key}
    UPDATE_DELAYED_GCODE ID=_RF_KEY_REPEAT DURATION={k.interval}
  {% endif %}

[gcode_macro _RF_KEY_ACTION]
gcode:
  {% set k = printer["gcode_macro RF_KEY_HOLD"] %}
  {% set key = params.KEY %}
  {% set printing = printer.print_stats.state == "printing" %}
  {% set z_homed = "z" in printer.toolhead.homed_axes %}
  {% set e = printer.toolhead.extruder %}
  {% if key in ["BED_UP", "BED_DOWN"] %}
    {% set dir = -1 if key == "BED_UP" else 1 %}
    {% if printing %}
      # Live Z adjust while printing (RF fw behaviour)
      SET_GCODE_OFFSET Z_ADJUST={dir * k.babystep} MOVE=1
    {% elif z_homed %}
      {% set step = [k.z_step * (1 + k.count / 4.0), k.z_step_max]|min %}
      {% set th = printer.toolhead %}
      # stay 3mm away from Z max (Z-max switch) and above Z 0
      {% set z = [[th.position.z + dir * step, 0.0]|max, th.axis_maximum.z - 3]|min %}
      {% if (z - th.position.z)|abs > 0.0001 %}
        SAVE_GCODE_STATE NAME=_rf_key
        G91
        G1 Z{z - th.position.z} F{[600, step / k.interval * 60]|max}
        RESTORE_GCODE_STATE NAME=_rf_key
      {% endif %}
    {% else %}
      # RF fw: "moving z aborted (not homed)" - no endstop protection
      RESPOND TYPE=error MSG="Home Z first (G28 Z) - the bed keys need a homed Z axis"
      RF_KEY_RELEASE
    {% endif %}
  {% elif key in ["EXTRUDE", "RETRACT"] and not printing %}
    {% if printer[e].can_extrude %}
      _RF_E_FULL_CURRENT
      M83
      G1 E{k.e_step if key == "EXTRUDE" else -k.e_step} F300
    {% else %}
      RESPOND TYPE=error MSG="{e} too cold to extrude"
      RF_KEY_RELEASE
    {% endif %}
  {% endif %}
