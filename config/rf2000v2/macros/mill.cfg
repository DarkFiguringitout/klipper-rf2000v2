# =====================================================================
#  RF2000v2 operating mode PRINT / MILL (RF fw FEATURE_MILLING_MODE)
# =====================================================================
#  Mill mode:
#    * homing order Z (to the Z-max switch, bed away from the tool), X, Y
#    * heaters are switched off and the DMS emergency pause is disabled
#      (milling forces are much higher than printing forces)
#    * M3/M4/M5 switch the spindle output (230V socket by default)
#    * RF_FIND_Z_ORIGIN (M3130): raise the bed until the tool touches the
#      work part (500 digits) and make that Z=0
#    * RF_WORK_PART_SCAN (M3150): scan the work part surface into the bed
#      mesh profile "workpart" (RF work part z-compensation)
# =====================================================================

[gcode_macro RF_MODE]
description: Select the operating mode MODE=PRINT|MILL
variable_spindle_pin: "output_230v"
gcode:
  {% set m = params.MODE|default("PRINT")|lower %}
  {% if m not in ["print", "mill"] %}
    {action_raise_error("MODE must be PRINT or MILL")}
  {% endif %}
  {% set cur = printer.save_variables.variables.rf_mode|default("print") %}
  {% if m != cur %}
    TURN_OFF_HEATERS
    SET_PIN PIN={spindle_pin} VALUE=0
    SAVE_VARIABLE VARIABLE=rf_mode VALUE='"{m}"'
    M84
    {% if m == "mill" %}
      DMS_MONITOR ENABLE=0
      BED_MESH_CLEAR
    {% else %}
      DMS_MONITOR ENABLE=1
    {% endif %}
    RESPOND MSG="Operating mode: {m|upper} - home all axes (G28) before moving"
  {% else %}
    RESPOND MSG="Operating mode: {m|upper}"
  {% endif %}

[gcode_macro _RF_REQUIRE_MILL]
gcode:
  {% if printer.save_variables.variables.rf_mode|default("print") != "mill" %}
    {action_raise_error("Only available in mill mode (RF_MODE MODE=MILL)")}
  {% endif %}

[gcode_macro M3]
description: Spindle on (mill mode)
gcode:
  _RF_REQUIRE_MILL
  SET_PIN PIN={printer["gcode_macro RF_MODE"].spindle_pin} VALUE=1

[gcode_macro M4]
description: Spindle on (counter clockwise is not supported - same as M3)
gcode:
  M3

[gcode_macro M5]
description: Spindle off
gcode:
  SET_PIN PIN={printer["gcode_macro RF_MODE"].spindle_pin} VALUE=0

[gcode_macro RF_FIND_Z_ORIGIN]
description: Mill mode - find the work part surface and set Z=0
gcode:
  _RF_REQUIRE_MILL
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  DMS_FIND_Z_ORIGIN CONTACT_DELTA={params.CONTACT_DELTA|default(500)} PROBE_SPEED={params.SPEED|default(1.0)}
  # RF fw FIND_Z_ORIGIN_SCRIPT
  G91
  G1 Z15 F5000
  G90

[gcode_macro M3130]
description: RF compat - search the z origin
gcode:
  RF_FIND_Z_ORIGIN

[gcode_macro RF_WORK_PART_SCAN]
description: Mill mode - scan the work part surface (RF work part scan)
gcode:
  _RF_REQUIRE_MILL
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  BED_MESH_CALIBRATE PROFILE=workpart CONTACT_DELTA={params.CONTACT_DELTA|default(10)} HORIZONTAL_MOVE_Z={params.Z|default(15)} MESH_MIN={params.MESH_MIN|default("5,55")} MESH_MAX={params.MESH_MAX|default("195,170")} PROBE_COUNT={params.PROBE_COUNT|default("10,6")}

[gcode_macro M3150]
description: RF compat - start the work part scan
gcode:
  RF_WORK_PART_SCAN
