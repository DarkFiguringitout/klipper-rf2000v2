# =====================================================================
#  RF2000v2 homing, print start/end, pause/resume
# =====================================================================

[homing_override]
# RF fw homing order: print mode X,Y,Z (HOME_ORDER_XYZ) to the Z-min
# switch; mill mode Z,X,Y with Z homed to the Z-max switch so the bed moves
# away from the miller first (HOMING_ORDER_MILL).
axes: xyz
gcode:
  {% set mill = printer.save_variables.variables.rf_mode|default('print') == 'mill' %}
  {% set all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
  {% if mill %}
    {% if all or 'Z' in params %}HOME_Z_MAX{% endif %}
    {% if all or 'X' in params %}G28 X{% endif %}
    {% if all or 'Y' in params %}G28 Y{% endif %}
  {% else %}
    {% if all or 'X' in params %}G28 X{% endif %}
    {% if all or 'Y' in params %}G28 Y{% endif %}
    {% if all or 'Z' in params %}
      G28 Z
      # leave the switch (RF fw ENDSTOP_Z_BACK_MOVE)
      G91
      G1 Z5 F600
      G90
    {% endif %}
  {% endif %}

[gcode_macro PRINT_START]
description: Start a print. Slicer: PRINT_START BED=[bed] EXTRUDER=[t0] EXTRUDER1=[t1] TOOL=[initial_tool]
# MESH: load (load profile PROFILE), scan (new BED_MESH_CALIBRATE), none
variable_mesh: "load"
variable_profile: "default"
# Run a z-offset scan (RF M3900) at the start of each print
variable_z_offset_scan: True
variable_purge: True
gcode:
  {% set bed = params.BED|default(60)|float %}
  {% set t0 = params.EXTRUDER|default(params.EXTRUDER0|default(0))|float %}
  {% set t1 = params.EXTRUDER1|default(0)|float %}
  {% set tool = params.TOOL|default(params.INITIAL_TOOL|default(0))|int %}
  {% set mesh_mode = params.MESH|default(mesh)|lower %}
  {% set prof = params.PROFILE|default(profile) %}
  {% set probe_temp = 150 %}
  CLEAR_PAUSE
  DMS_MONITOR ENABLE=1 CLEAR=1
  M140 S{bed}
  # Pre-heat the nozzles below oozing temperature for probing
  {% if t0 > 0 %}M104 T0 S{[t0, probe_temp]|min}{% endif %}
  {% if t1 > 0 %}M104 T1 S{[t1, probe_temp]|min}{% endif %}
  T0
  G90
  M83
  G28
  M190 S{bed}
  {% if mesh_mode == "scan" %}
    BED_MESH_CALIBRATE PROFILE={prof}
  {% elif mesh_mode == "load" %}
    {% if prof in printer.bed_mesh.profiles %}
      BED_MESH_PROFILE LOAD={prof}
    {% else %}
      RESPOND TYPE=error MSG="Bed mesh profile '{prof}' not found - run BED_MESH_CALIBRATE (or RF_IMPORT_HBS) and SAVE_CONFIG"
    {% endif %}
  {% else %}
    BED_MESH_CLEAR
  {% endif %}
  {% if params.Z_OFFSET_SCAN|default(z_offset_scan)|int %}
    DMS_Z_OFFSET_SCAN
  {% endif %}
  G1 Z5 F600
  # Final temperatures
  {% if t0 > 0 %}M104 T0 S{t0}{% endif %}
  {% if t1 > 0 %}M104 T1 S{t1}{% endif %}
  {% if t0 > 0 %}M109 T0 S{t0}{% endif %}
  {% if t1 > 0 %}M109 T1 S{t1}{% endif %}
  # Zero the strain gauge at temperature with the nozzle free, so the
  # emergency/pressure functions work on force relative to idle
  DMS_TARE
  T{tool}
  {% if purge %}
    _RF_PURGE
  {% endif %}

[gcode_macro _RF_PURGE]
description: Purge line at the front edge with the active nozzle
gcode:
  G90
  G1 X5 Y5 Z0.3 F6000
  G92 E0
  M83
  G1 X80 E12 F900
  G1 X120 E4 F1200
  G1 Z1.0 F600
  G92 E0

[gcode_macro PRINT_END]
description: End of print
gcode:
  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% set z = printer.toolhead.position.z|float %}
  M83
  G1 E-2 F1800
  G91
  G1 Z{[10, max_z - z - 1]|min} F600
  G90
  G1 X0 Y200 F6000
  TURN_OFF_HEATERS
  M107
  DMS_PRESSURE_CONTROL OFF=1
  DMS_SENSE_OFFSET DIGITS=0
  DMS_FLOW_COMPENSATION OFF=1
  M84

[gcode_macro PAUSE]
description: Pause the print (RF fw pause button behaviour)
rename_existing: PAUSE_BASE
# RF fw DEFAULT_PAUSE_STEPS: X/Y +50mm, Z +2mm, E retract
variable_retract: 2.0
variable_z_lift: 2.0
variable_xy_move: 50.0
# EXTRUDER_CURRENT_PAUSED (~0.5A) to avoid heating the filament
variable_paused_torque: 32
variable_cooldown: 0
gcode:
  {% if not printer.pause_resume.is_paused %}
    PAUSE_BASE
    {% set th = printer.toolhead %}
    {% set e = th.extruder %}
    {% set x = [th.position.x + xy_move, th.axis_maximum.x - 5]|min %}
    {% set y = [th.position.y + xy_move, th.axis_maximum.y - 5]|min %}
    {% set z = [th.position.z + z_lift, th.axis_maximum.z]|min %}
    M83
    {% if printer[e].can_extrude %}
      G1 E-{retract} F1800
    {% endif %}
    G90
    G1 Z{z} F600
    G1 X{x} Y{y} F6000
    SET_DRV_CURRENT STEPPER={e} TORQUE={paused_torque} TEMPORARY=1
    {% if cooldown > 0 %}
      SET_HEATER_TEMPERATURE HEATER={e} TARGET={cooldown}
    {% endif %}
    M300 P200
  {% endif %}

[gcode_macro RESUME]
description: Resume the print
rename_existing: RESUME_BASE
variable_resume_temp: 0
gcode:
  {% if printer.pause_resume.is_paused %}
    {% set e = printer.toolhead.extruder %}
    SET_DRV_CURRENT STEPPER={e} RESTORE=1
    {% if printer[e].target < printer[e].temperature - 50 %}
      RESPOND TYPE=error MSG="Heat {e} again before RESUME"
    {% endif %}
    DMS_MONITOR CLEAR=1
    M83
    {% if printer[e].can_extrude %}
      G1 E{printer["gcode_macro PAUSE"].retract} F1800
    {% endif %}
    # RESUME_BASE moves back to the saved position (PAUSE_STATE)
    RESUME_BASE VELOCITY=100
  {% endif %}

[gcode_macro CANCEL_PRINT]
description: Cancel the print
rename_existing: CANCEL_PRINT_BASE
gcode:
  {% if printer.pause_resume.is_paused %}
    SET_DRV_CURRENT STEPPER={printer.toolhead.extruder} RESTORE=1
  {% endif %}
  TURN_OFF_HEATERS
  CLEAR_PAUSE
  CANCEL_PRINT_BASE
  PRINT_END

[gcode_macro M600]
description: Filament change
gcode:
  PAUSE
  DMS_UNLOAD_FILAMENT
  RESPOND MSG="Insert new filament, then run DMS_LOAD_FILAMENT and RESUME"

[gcode_macro M300]
description: Beep (P = duration in ms)
gcode:
  {% set p = params.P|default(100)|int %}
  SET_PIN PIN=beeper VALUE=1
  G4 P{p}
  SET_PIN PIN=beeper VALUE=0

[gcode_macro PARK]
description: Park the head (RF fw M3080)
variable_x: 0
variable_y: 200
variable_z_lift: 10
gcode:
  {% if "xyz" in printer.toolhead.homed_axes %}
    {% set z = [printer.toolhead.position.z + z_lift, printer.toolhead.axis_maximum.z]|min %}
    G90
    G1 Z{z} F600
    G1 X{x} Y{y} F6000
  {% endif %}

[gcode_macro LOAD_FILAMENT]
description: Load filament into the active extruder (stops on nozzle force)
gcode:
  {% set e = printer.toolhead.extruder %}
  {% set t = params.TEMP|default(220)|float %}
  {% if printer[e].temperature < t - 5 %}
    M109 S{t}
  {% endif %}
  M83
  DMS_LOAD_FILAMENT DIGITS={params.DIGITS|default(3500)}

[gcode_macro UNLOAD_FILAMENT]
description: Unload filament from the active extruder
gcode:
  {% set e = printer.toolhead.extruder %}
  {% set t = params.TEMP|default(220)|float %}
  {% if printer[e].temperature < t - 5 %}
    M109 S{t}
  {% endif %}
  M83
  DMS_UNLOAD_FILAMENT DIGITS={params.DIGITS|default(4500)} LENGTH={params.LENGTH|default(90)}
