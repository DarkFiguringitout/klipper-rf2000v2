# =====================================================================
#  RF2000v2 dual extrusion
# =====================================================================
#  Both nozzles sit on one carriage.  T1 (right) is 33.6mm to the right of
#  T0 (EXT1_X_OFFSET in the RF firmware).  Coordinates are always nozzle
#  coordinates of the active tool, so slicer profiles made for the stock
#  firmware work unchanged:
#    * X/Y offset   -> SET_GCODE_OFFSET X/Y (absolute)
#    * Z offset     -> SET_GCODE_OFFSET Z_ADJUST (relative, so a z-offset
#                      from DMS_Z_OFFSET_SCAN or babystepping is kept)
#    * bed mesh     -> BED_MESH_OFFSET so the mesh is looked up under the
#                      active nozzle and not under the carriage reference
#  Offsets are stored in rf2000v2_variables.cfg:
#    t1_x_offset (default 33.6), t1_y_offset (0), t1_z_offset (0)
#  RF_ALIGN_EXTRUDERS measures t1_z_offset with the strain gauge.
#  SET_TOOL_OFFSET X= Y= Z= sets them by hand.
# =====================================================================

[gcode_macro _RF_TOOL]
description: Internal tool change helper
# currently applied tool z offset (relative part of the g-code Z offset)
variable_applied_z: 0.0
variable_z_hop: 0.6
variable_travel_speed: 150
gcode:
  {% set tool = params.TOOL|int %}
  {% set sv = printer.save_variables.variables %}
  {% if tool == 1 %}
    {% set ext = "extruder1" %}
    {% set xo = sv.t1_x_offset|default(33.6)|float %}
    {% set yo = sv.t1_y_offset|default(0.0)|float %}
    {% set zo = sv.t1_z_offset|default(0.0)|float %}
  {% else %}
    {% set ext = "extruder" %}
    {% set xo = 0.0 %}
    {% set yo = 0.0 %}
    {% set zo = 0.0 %}
  {% endif %}
  {% set homed = "xyz" in printer.toolhead.homed_axes %}
  {% set was_abs = printer.gcode_move.absolute_coordinates %}
  {% set changing = printer.toolhead.extruder != ext %}
  {% if changing and homed %}
    G91
    G1 Z{z_hop} F1200
  {% endif %}
  {% if changing %}
    ACTIVATE_EXTRUDER EXTRUDER={ext}
  {% endif %}
  # Nozzle offset: X/Y absolute, Z relative (keeps a z-offset scan or
  # babystepping).  One MOVE=1 while lifted, so the new nozzle is at the
  # same XYZ immediately - even if the next move has no Z word.
  {% set dz = zo - applied_z %}
  {% set th = printer.toolhead %}
  {% set org = printer.gcode_move.homing_origin %}
  # carriage position that keeps the nozzle at the same XY
  {% set nx = th.position.x - xo - org.x %}
  {% set ny = th.position.y - yo - org.y %}
  {% set nz = th.position.z + (z_hop if changing and homed else 0.0) + dz %}
  {% set inside = th.axis_minimum.x <= nx <= th.axis_maximum.x and th.axis_minimum.y <= ny <= th.axis_maximum.y %}
  SET_GCODE_OFFSET X={0.0 - xo} Y={0.0 - yo} Z_ADJUST={dz} MOVE={1 if homed and inside else 0} MOVE_SPEED={travel_speed}
  {% if homed and not inside %}
    # e.g. right after homing (carriage at the X switch): move the carriage
    # to the nearest reachable position instead
    {% set cx = [[nx, th.axis_minimum.x]|max, th.axis_maximum.x]|min %}
    {% set cy = [[ny, th.axis_minimum.y]|max, th.axis_maximum.y]|min %}
    G90
    G1 X{cx + xo} Y{cy + yo} Z{nz - org.z - dz} F{travel_speed * 60}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_RF_TOOL VARIABLE=applied_z VALUE={zo}
  _RF_MESH_TOOL_OFFSET TOOL={tool}
  {% if changing and homed %}
    G91
    G1 Z-{z_hop} F1200
  {% endif %}
  {% if was_abs %}G90{% else %}G91{% endif %}
  {% if printer.save_variables.variables.active_tool|default(0)|int != tool %}
    SAVE_VARIABLE VARIABLE=active_tool VALUE={tool}
  {% endif %}

[gcode_macro T0]
description: Select the left extruder
gcode:
  _RF_TOOL TOOL=0

[gcode_macro T1]
description: Select the right extruder
gcode:
  _RF_TOOL TOOL=1

[gcode_macro SET_TOOL_OFFSET]
description: Set/store the T1 nozzle offsets relative to T0 (mm)
gcode:
  {% set sv = printer.save_variables.variables %}
  {% set x = params.X|default(sv.t1_x_offset|default(33.6))|float %}
  {% set y = params.Y|default(sv.t1_y_offset|default(0.0))|float %}
  {% set z = params.Z|default(sv.t1_z_offset|default(0.0))|float %}
  SAVE_VARIABLE VARIABLE=t1_x_offset VALUE={x}
  SAVE_VARIABLE VARIABLE=t1_y_offset VALUE={y}
  SAVE_VARIABLE VARIABLE=t1_z_offset VALUE={z}
  RESPOND MSG="T1 offset X={x} Y={y} Z={z} (stored)"
  {% if printer.toolhead.extruder == "extruder1" %}
    _RF_TOOL TOOL=1
  {% endif %}

[gcode_macro M3919]
description: RF compat - set T1 z offset in micrometers (M3919 S<um>)
gcode:
  SET_TOOL_OFFSET Z={params.S|default(0)|float / 1000.0}

# ---------------------------------------------------------------------
#  Extruder alignment with the strain gauge (RF fw M3309 /
#  FEATURE_ALIGN_EXTRUDERS): probe the same bed point with both nozzles.
# ---------------------------------------------------------------------
[gcode_macro RF_ALIGN_EXTRUDERS]
description: Measure the height difference of T0 and T1 with the DMS
gcode:
  {% set x = params.X|default(100)|float %}
  {% set y = params.Y|default(150)|float %}
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  T0
  G90
  G1 Z3 F600
  G1 X{x} Y{y} F6000
  G1 Z1 F600
  PROBE
  G1 Z3 F600
  _RF_ALIGN_SECOND X={x} Y={y}

[gcode_macro _RF_ALIGN_SECOND]
gcode:
  {% set z0 = printer.probe.last_probe_position.z %}
  T1
  G90
  G1 X{params.X} Y{params.Y} F6000
  G1 Z1 F600
  PROBE
  G1 Z3 F600
  _RF_ALIGN_FINISH Z0={z0}

[gcode_macro _RF_ALIGN_FINISH]
gcode:
  {% set z0 = params.Z0|float %}
  {% set z1 = printer.probe.last_probe_position.z %}
  {% set d = z1 - z0 %}
  T0
  SET_TOOL_OFFSET Z={d}
  RESPOND MSG="Extruder alignment: T0 contact {'%.4f' % z0}, T1 contact {'%.4f' % z1}, T1 z offset {'%.4f' % d} mm"
  {% if d|abs > 0.3 %}
    RESPOND TYPE=error MSG="T1 differs by more than 0.3mm - adjust the T1 hotend mechanically (RF2000 alignment screw) and run again"
  {% endif %}

[gcode_macro M3309]
description: RF compat - align extruders
gcode:
  RF_ALIGN_EXTRUDERS

# Restore the last active tool after a restart
[delayed_gcode _RF_RESTORE_TOOL]
initial_duration: 1.0
gcode:
  {% set t = printer.save_variables.variables.active_tool|default(0)|int %}
  _RF_TOOL TOOL={t}

# ---------------------------------------------------------------------
#  Bed mesh and the active nozzle
#  BED_MESH_OFFSET only applies to the currently loaded mesh, so it is
#  re-applied whenever a mesh is loaded, calibrated or imported.  Meshes are
#  always measured with T0 (the mesh is stored in T0 coordinates).
# ---------------------------------------------------------------------
[gcode_macro _RF_MESH_TOOL_OFFSET]
gcode:
  {% set tool = params.TOOL|default(1 if printer.toolhead.extruder == "extruder1" else 0)|int %}
  {% set sv = printer.save_variables.variables %}
  {% if printer.bed_mesh.profile_name %}
    {% if tool == 1 %}
      BED_MESH_OFFSET X={sv.t1_x_offset|default(33.6)} Y={sv.t1_y_offset|default(0.0)}
    {% else %}
      BED_MESH_OFFSET X=0 Y=0
    {% endif %}
  {% endif %}

[gcode_macro BED_MESH_PROFILE]
rename_existing: BED_MESH_PROFILE_BASE
gcode:
  BED_MESH_PROFILE_BASE {rawparams}
  {% if params.LOAD is defined %}
    _RF_MESH_TOOL_OFFSET
  {% endif %}

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BED_MESH_CALIBRATE_BASE
gcode:
  {% set t1 = printer.toolhead.extruder == "extruder1" %}
  {% if t1 %}T0{% endif %}
  BED_MESH_CALIBRATE_BASE {rawparams}
  {% if t1 %}T1{% else %}_RF_MESH_TOOL_OFFSET{% endif %}

[gcode_macro RF_IMPORT_HBS]
rename_existing: RF_IMPORT_HBS_BASE
gcode:
  RF_IMPORT_HBS_BASE {rawparams}
  _RF_MESH_TOOL_OFFSET

# ---------------------------------------------------------------------
#  Ditto printing (RF fw FEATURE_DITTO_PRINTING): T1 extrudes the same as
#  T0, printing two copies 33.6mm apart.  Keep the object narrower than
#  33.6mm minus a margin and inside X 0..136 (T1 then prints at +33.6).
# ---------------------------------------------------------------------
[gcode_macro RF_DITTO]
description: Ditto printing on/off (S=1/0) - T1 copies T0's extrusion
gcode:
  {% if params.S|default(1)|int %}
    T0
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder
    RESPOND MSG="Ditto printing ON: heat both nozzles (M104 T1 S..)"
  {% else %}
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder1
    RESPOND MSG="Ditto printing OFF"
  {% endif %}
