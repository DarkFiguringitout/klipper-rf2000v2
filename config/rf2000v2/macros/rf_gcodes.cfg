# =====================================================================
#  Compatibility layer for G-code written for the RF firmware
#  (RF1000/RF2000 M3xxx commands).  Commands that need the strain gauge
#  (M3900, M3909, M3911, M3913, M3914, M3939) are provided by the
#  rf2000_dms module; M3309/M3919 by toolchange.cfg; M3130/M3150 by
#  mill.cfg; M3920 by outputs.cfg.
# =====================================================================

# ---------------------------------------------------------------------
#  Heated bed temperature compensation (RF fw
#  FEATURE_HEAT_BED_TEMP_COMPENSATION).  The bed sensor is below the print
#  plate; the compensation raises the sensor set point so the *surface*
#  reaches the requested temperature.
#  The official Conrad RF2000v2 firmware uses an identity table (no change)
#  so this is OFF by default: temperatures behave exactly as with the stock
#  firmware.  The table below is the community firmware's (Nibbels) table;
#  set variable_enabled: True to use it (only M140/M190 are compensated,
#  SET_HEATER_TEMPERATURE from the web UI is not).
# ---------------------------------------------------------------------
[gcode_macro _BED_TEMP_COMP]
variable_enabled: False
variable_setpoints: [60, 80, 100, 120, 140, 160]
variable_measured: [58, 76, 94, 112, 130, 150]
# a few degrees below [heater_bed] max_temp (180) to leave room for overshoot
variable_max_temp: 175
gcode:
  {% set t = params.S|default(0)|float %}
  {% if enabled and t > 0 %}
    {% set ns = namespace(out=t * setpoints[0] / measured[0]) %}
    {% for i in range(setpoints|length - 1) %}
      {% if t >= measured[i] %}
        {% set ns.out = setpoints[i] + (t - measured[i]) * (setpoints[i+1] - setpoints[i]) / (measured[i+1] - measured[i]) %}
      {% endif %}
    {% endfor %}
    {% set t = [ns.out, max_temp]|min %}
  {% endif %}
  {params.CMD} S{'%.1f' % t}

[gcode_macro M140]
description: Set bed temperature (surface compensated)
rename_existing: M140.1
gcode:
  _BED_TEMP_COMP CMD=M140.1 S={params.S|default(0)}

[gcode_macro M190]
description: Set bed temperature and wait (surface compensated)
rename_existing: M190.1
gcode:
  _BED_TEMP_COMP CMD=M190.1 S={params.S|default(0)}

# ---------------------------------------------------------------------
#  Z compensation (heat bed scan = bed_mesh)
# ---------------------------------------------------------------------
[gcode_macro M3000]
description: RF compat - z-compensation off
gcode:
  BED_MESH_CLEAR

[gcode_macro M3001]
description: RF compat - z-compensation on (loads the active profile)
gcode:
  {% set p = printer.save_variables.variables.rf_active_mesh|default("default") %}
  BED_MESH_PROFILE LOAD={p}

[gcode_macro M3006]
description: RF compat - static z offset (S=um or Z=mm)
gcode:
  {% if params.Z is defined %}
    {% set z = params.Z|float %}
  {% else %}
    {% set z = params.S|default(0)|float / 1000.0 %}
  {% endif %}
  SET_GCODE_OFFSET Z={z}

[gcode_macro M3009]
description: RF compat - choose the active heat bed matrix (S=1..9)
gcode:
  {% if params.S is defined %}
    {% set p = "default" if params.S|int == 1 else "hbs_" ~ params.S %}
    SAVE_VARIABLE VARIABLE=rf_active_mesh VALUE='"{p}"'
    RESPOND MSG="Active heat bed matrix: {p}"
  {% else %}
    RESPOND MSG="Active heat bed matrix: {printer.save_variables.variables.rf_active_mesh|default('default')}"
  {% endif %}

[gcode_macro M3010]
description: RF compat - start the heat bed scan
gcode:
  {% set p = printer.save_variables.variables.rf_active_mesh|default("default") %}
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  BED_MESH_CALIBRATE PROFILE={p}

[gcode_macro M3011]
description: RF compat - clear a heat bed matrix (S=1..9)
gcode:
  {% set p = "default" if params.S|default(1)|int == 1 else "hbs_" ~ params.S %}
  BED_MESH_PROFILE REMOVE={p}

[gcode_macro M3013]
description: RF compat - output the heat bed matrix
gcode:
  BED_MESH_OUTPUT

[gcode_macro M3140]
description: RF compat - work part z-compensation off
gcode:
  BED_MESH_CLEAR

[gcode_macro M3141]
description: RF compat - work part z-compensation on
gcode:
  BED_MESH_PROFILE LOAD=workpart

[gcode_macro M3146]
description: RF compat - static z offset for milling (S=um or Z=mm)
gcode:
  M3006 {rawparams}

[gcode_macro M3060]
description: RF compat - device type and firmware version
gcode:
  RESPOND MSG="Renkforce RF2000v2 running Klipper (klipper-rf2000v2)"

# ---------------------------------------------------------------------
#  Pause / park / status / emergency limits
# ---------------------------------------------------------------------
[gcode_macro M3070]
description: RF compat - pause like the pause button
gcode:
  PAUSE

[gcode_macro M3075]
description: RF compat - emergency pause digits (S=min P=max)
gcode:
  DMS_SET_LIMITS {% if params.S is defined %}PAUSE_MIN={params.S}{% endif %} {% if params.P is defined %}PAUSE_MAX={params.P}{% endif %}

[gcode_macro M3076]
description: RF compat - emergency stop digits (S=min P=max)
gcode:
  DMS_SET_LIMITS {% if params.S is defined %}STOP_MIN={params.S}{% endif %} {% if params.P is defined %}STOP_MAX={params.P}{% endif %}

[gcode_macro M3080]
description: RF compat - park the printer
gcode:
  PARK

[gcode_macro M3103]
description: RF compat - park position (X Y Z-lift)
gcode:
  {% for a, v in params.items() %}
    {% if a in ["X", "Y"] %}
      SET_GCODE_VARIABLE MACRO=PARK VARIABLE={a|lower} VALUE={v}
    {% elif a == "Z" %}
      SET_GCODE_VARIABLE MACRO=PARK VARIABLE=z_lift VALUE={v}
    {% endif %}
  {% endfor %}

[gcode_macro M3105]
description: RF compat - pause offsets (X/Y move, Z lift, E retract)
gcode:
  {% if params.X is defined or params.Y is defined %}
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=xy_move VALUE={params.X|default(params.Y)}
  {% endif %}
  {% if params.Z is defined %}
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=z_lift VALUE={params.Z}
  {% endif %}
  {% if params.E is defined %}
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=retract VALUE={params.E}
  {% endif %}

[gcode_macro M3117]
description: RF compat - status text
gcode:
  M117 {rawparams}

# ---------------------------------------------------------------------
#  Outputs
# ---------------------------------------------------------------------
[gcode_macro M3120]
description: RF compat - case fan on
gcode:
  RESPOND MSG="Case fan is automatic (controller_fan) - it runs while the printer is active"

[gcode_macro M3121]
description: RF compat - case fan off
gcode:
  RESPOND MSG="Case fan is automatic (controller_fan) - it stops after idle_timeout"

[gcode_macro M3300]
description: RF compat - 24V FET outputs (P=1..3 S=0/1)
gcode:
  SET_FET P={params.P|default(1)} S={params.S|default(0)}

[gcode_macro M3301]
description: RF compat - 230V output (S=0/1)
gcode:
  SET_MAINS_OUTPUT S={params.S|default(0)}

[gcode_macro M355]
description: Case light (S=0/1, Wessix X19 equivalent)
gcode:
  {% if params.S is defined %}
    SET_LED LED=case_light WHITE={1 if params.S|int else 0}
  {% else %}
    RF_KEY_RIGHT
  {% endif %}

# RGB colours: P1=red P2=green P3=blue, S=0..255
[gcode_macro M3303]
description: RF compat - RGB colour for heating
gcode:
  _RGB_COLOR STATE=heating {'RGB'[params.P|default(1)|int - 1]}={params.S|default(0)}

[gcode_macro M3304]
description: RF compat - RGB colour for printing
gcode:
  _RGB_COLOR STATE=printing {'RGB'[params.P|default(1)|int - 1]}={params.S|default(0)}

[gcode_macro M3305]
description: RF compat - RGB colour for cooling
gcode:
  _RGB_COLOR STATE=cooling {'RGB'[params.P|default(1)|int - 1]}={params.S|default(0)}

[gcode_macro M3306]
description: RF compat - RGB colour for idle
gcode:
  _RGB_COLOR STATE=idle {'RGB'[params.P|default(1)|int - 1]}={params.S|default(0)}

[gcode_macro M3307]
description: RF compat - manual RGB colour
gcode:
  RGB_LIGHT MODE=MANUAL {'RGB'[params.P|default(1)|int - 1]}={params.S|default(0)}

[gcode_macro M3308]
description: RF compat - RGB light mode (P=0 off, 1 white, 2 auto, 3 manual)
gcode:
  RGB_LIGHT MODE={["OFF", "WHITE", "AUTO", "MANUAL"][params.P|default(1)|int]}

# ---------------------------------------------------------------------
#  Diagnostics
# ---------------------------------------------------------------------
[gcode_macro M3941]
description: RF compat - read the optional X35 temperature port
gcode:
  {% if "temperature_sensor X35" in printer %}
    RESPOND MSG="X35: {'%.1f' % printer['temperature_sensor X35'].temperature} C"
  {% else %}
    RESPOND TYPE=error MSG="Enable [temperature_sensor X35] in hardware.cfg first"
  {% endif %}

[gcode_macro M3987]
description: RF compat - read the motor driver status
gcode:
  DRV_STATUS_ALL
