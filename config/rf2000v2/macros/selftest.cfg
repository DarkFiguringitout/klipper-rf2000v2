# =====================================================================
#  RF2000v2 hardware self-test (docs/09-hardware-validation.md)
#
#  Run the steps in order on the real printer and note OK/FAIL for each.
#  Every step prints what you should see / hear.  RF_SELFTEST_ALL runs the
#  safe, non-moving steps; motion, heater and probe steps are separate so
#  you can watch them.
# =====================================================================

[gcode_macro _ST]
gcode:
  RESPOND MSG="SELFTEST {params.MSG}"

[gcode_macro RF_SELFTEST_ALL]
description: Self-test steps that do not move or heat (1-4)
gcode:
  RF_SELFTEST_DRIVERS
  RF_SELFTEST_SENSORS
  RF_SELFTEST_ENDSTOPS
  RF_SELFTEST_DMS
  _ST MSG="Steps 1-4 done. Continue with RF_SELFTEST_OUTPUTS, RF_SELFTEST_MOTION, RF_SELFTEST_HEATERS, RF_SELFTEST_PROBE"

[gcode_macro RF_SELFTEST_DRIVERS]
description: Step 1 - DRV8711 drivers configured and fault free
gcode:
  _ST MSG="1 DRIVERS: expect (no faults) for all 5 drivers - info bits UVLO/STD/STDLAT are not faults (0x000/0xfff = readback not possible, see docs/01)"
  DRV_STATUS_ALL
  {% for s in ["stepper_x", "stepper_y", "stepper_z", "extruder", "extruder1"] %}
    DRV_DUMP STEPPER={s}
  {% endfor %}

[gcode_macro RF_SELFTEST_SENSORS]
description: Step 2 - thermistors plausible at room temperature
gcode:
  {% for h in ["extruder", "extruder1", "heater_bed"] %}
    {% set t = printer[h].temperature %}
    {% if printer[h].target == 0 and (t < 10 or t > 40) %}
      _ST MSG="2 SENSORS: {h} = {'%.1f' % t} C - FAIL if the printer is cold (wrong sensor_type? docs/04 step 5)"
    {% else %}
      _ST MSG="2 SENSORS: {h} = {'%.1f' % t} C - OK if this is room temperature"
    {% endif %}
  {% endfor %}

[gcode_macro RF_SELFTEST_ENDSTOPS]
description: Step 3 - endstop states (press each switch and run again)
gcode:
  _ST MSG="3 ENDSTOPS: all must be 'open'; hold a switch and run RF_SELFTEST_ENDSTOPS again - that one must read TRIGGERED"
  QUERY_ENDSTOPS
  QUERY_Z_MAX
  QUERY_BUTTON BUTTON=drv8711_fault

[gcode_macro RF_SELFTEST_DMS]
description: Step 4 - strain gauge noise
gcode:
  _ST MSG="4 DMS: range should be well below 15 digits with the nozzle free; then push the nozzle up by hand and run DMS_READ - value must change by >100 digits"
  DMS_TEST SAMPLES=30
  DMS_READ

[gcode_macro RF_SELFTEST_OUTPUTS]
description: Step 5 - lights, fan, buzzer, FETs, 230V (watch and listen)
gcode:
  _ST MSG="5 OUTPUTS: RGB red, green, blue, white; case light off/on; beep; part fan 2s at 50% and 100%"
  SET_LED LED=rgb RED=1 GREEN=0 BLUE=0
  G4 P1500
  SET_LED LED=rgb RED=0 GREEN=1 BLUE=0
  G4 P1500
  SET_LED LED=rgb RED=0 GREEN=0 BLUE=1
  G4 P1500
  SET_LED LED=rgb RED=1 GREEN=1 BLUE=1
  SET_LED LED=case_light WHITE=0
  G4 P1500
  SET_LED LED=case_light WHITE=1
  M300 P300
  M106 S128
  G4 P2000
  M106 S255
  G4 P2000
  M107
  _ST MSG="5 OUTPUTS: now FET1 (X42), FET2 (X44), 230V socket switch on for 2s each - check with a lamp/multimeter if something is connected"
  SET_PIN PIN=fet1_x42 VALUE=1
  G4 P2000
  SET_PIN PIN=fet1_x42 VALUE=0
  SET_PIN PIN=fet2_x44 VALUE=1
  G4 P2000
  SET_PIN PIN=fet2_x44 VALUE=0
  SET_PIN PIN=output_230v VALUE=1
  G4 P2000
  SET_PIN PIN=output_230v VALUE=0
  _ST MSG="5 OUTPUTS done. Keys: press each front key - the LCD menu must react (OK/up/down/back), RIGHT toggles the case light, pause/continue only act while printing"

[gcode_macro RF_SELFTEST_MOTION]
description: Step 6 - homing and axis directions (keep a hand on the power switch)
gcode:
  _ST MSG="6 MOTION: homing X, Y, then Z to the Z-min switch"
  G28
  G90
  _ST MSG="6 MOTION: head moves RIGHT 50mm, then back"
  G1 X50 F3000
  G1 X0 F3000
  _ST MSG="6 MOTION: Y moves 50mm away from its switch, then back"
  G1 Y50 F3000
  G1 Y0 F3000
  _ST MSG="6 MOTION: bed moves DOWN 20mm, then up to Z5"
  G1 Z25 F600
  G1 Z5 F600
  _ST MSG="6 MOTION: tool change T1 - carriage moves 33.6mm LEFT, T0 back"
  G1 X60 Y60 F3000
  T1
  G4 P1000
  T0
  QUERY_Z_MAX
  _ST MSG="6 MOTION done - every direction as described? (else toggle '!' on that dir_pin)"

[gcode_macro RF_SELFTEST_HEATERS]
description: Step 7 - both hotends and the bed heat up (then turned off)
gcode:
  _ST MSG="7 HEATERS: T0, T1 to 100C and bed to 50C - all three temperatures must rise"
  M104 T0 S100
  M104 T1 S100
  M140 S50
  TEMPERATURE_WAIT SENSOR=extruder MINIMUM=95
  TEMPERATURE_WAIT SENSOR=extruder1 MINIMUM=95
  TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM=47
  _ST MSG="7 HEATERS: OK - now cooling down. Next: PID_CALIBRATE (docs/04 step 5)"
  TURN_OFF_HEATERS

[gcode_macro RF_SELFTEST_PROBE]
description: Step 8 - strain gauge probing repeatability and T1 alignment
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  _ST MSG="8 PROBE: PROBE_ACCURACY at the bed center (expect standard deviation < 0.01mm)"
  T0
  G90
  G1 Z3 F600
  G1 X85 Y145 F6000
  G1 Z1.5 F600
  PROBE_ACCURACY SAMPLES=5
  G1 Z5 F600
  _ST MSG="8 PROBE: measuring the T1 height (RF_ALIGN_EXTRUDERS)"
  RF_ALIGN_EXTRUDERS X=85 Y=145
  _ST MSG="8 PROBE done. Then BED_MESH_CALIBRATE and SAVE_CONFIG (docs/04 step 7)"
