# =====================================================================
#  RF2000v2 front panel: HD44780 20x4 LCD (4 bit) and 11 keys
# =====================================================================
#  Key mapping of the RF firmware (ui.h):
#    TAST1 [4]  PG5  OK          -> menu click
#    TAST2 [13] PB7  NEXT (down) -> menu down
#    TAST5 [42] PL7  PREVIOUS    -> menu up
#    TAST4 [11] PB5  BACK        -> menu back
#    TAST3 [17] PH0  RIGHT       -> RF_KEY_RIGHT macro
#    X12.1 [80] PJ2  bed up      -> RF_KEY_BED_UP (hold to repeat)
#    X12.2 [81] PJ4  bed down    -> RF_KEY_BED_DOWN (hold to repeat)
#    X12.3 [82] PJ5  retract     -> RF_KEY_RETRACT (hold to repeat)
#    X12.4 [83] PJ6  extrude     -> RF_KEY_EXTRUDE (hold to repeat)
#    X12.6 [85] PH7  continue    -> RESUME
#    X12.7 [86] PH2  pause       -> PAUSE
#  All keys connect the pin to GND (pull-up, active low).
# =====================================================================

[display]
lcd_type: hd44780
rs_pin: PK1                   # D_RS [63]
e_pin: PK3                    # D_E [65]
d4_pin: PF5                   # D_D4 [59]
d5_pin: PK2                   # D_D5 [64]
d6_pin: PA1                   # D_D6 [23]
d7_pin: PJ3                   # D_D7 [98]
line_length: 20
up_pin: ^!PL7
down_pin: ^!PB7
click_pin: ^!PG5
back_pin: ^!PB5
menu_timeout: 60
display_group: _rf2000v2_20x4

# Status screen: Klipper's default 20x4 layout plus the strain gauge force
# (DMS digits, like the RF firmware's mod menu) next to the fan speed.
[display_data _rf2000v2_20x4 extruder]
position: 0, 0
text: { render("_heater_temperature", param_heater_name="extruder") }

[display_data _rf2000v2_20x4 heater_bed]
position: 0, 10
text: { render("_heater_temperature", param_heater_name="heater_bed") }

[display_data _rf2000v2_20x4 extruder1]
position: 1, 0
text: { render("_heater_temperature", param_heater_name="extruder1") }

[display_data _rf2000v2_20x4 fan]
position: 1, 10
text:
  {% if 'fan' in printer %}
    { "F{:>4.0%}".format(printer.fan.speed) }
  {% endif %}

[display_data _rf2000v2_20x4 dms]
position: 1, 15
text:
  {% set f = printer.rf2000_dms.force %}
  {% if f is not none %}{"%5d" % ([[f, -9999]|max, 99999]|min)}{% endif %}

[display_data _rf2000v2_20x4 speed_factor]
position: 2, 0
text:
  ~feedrate~
  { "{:^4.0%}".format(printer.gcode_move.speed_factor) }

[display_data _rf2000v2_20x4 print_progress]
position: 2, 8
text:
  {% if 'virtual_sdcard' in printer and printer.virtual_sdcard.progress %}
    ~sd~
  {% else %}
    ~usb~
  {% endif %}
  { "{:^4.0%}".format(printer.display_status.progress) }

[display_data _rf2000v2_20x4 printing_time]
position: 2, 14
text:
  ~clock~
  { render("_printing_time") }

[display_data _rf2000v2_20x4 print_status]
position: 3, 0
text: { render("_print_status") }

[gcode_button key_right]
pin: ^!PH0
press_gcode:
  RF_KEY_RIGHT

[gcode_button key_bed_up]
pin: ^!PJ2
press_gcode:
  RF_KEY_HOLD KEY=BED_UP
release_gcode:
  RF_KEY_RELEASE

[gcode_button key_bed_down]
pin: ^!PJ4
press_gcode:
  RF_KEY_HOLD KEY=BED_DOWN
release_gcode:
  RF_KEY_RELEASE

[gcode_button key_retract]
pin: ^!PJ5
press_gcode:
  RF_KEY_HOLD KEY=RETRACT
release_gcode:
  RF_KEY_RELEASE

[gcode_button key_extrude]
pin: ^!PJ6
press_gcode:
  RF_KEY_HOLD KEY=EXTRUDE
release_gcode:
  RF_KEY_RELEASE

[gcode_button key_continue]
pin: ^!PH7
press_gcode:
  {% if printer.pause_resume.is_paused %}RESUME{% endif %}

[gcode_button key_pause]
pin: ^!PH2
press_gcode:
  {% if printer.pause_resume.is_paused %}
    RESUME
  {% elif printer.print_stats.state == "printing" %}
    PAUSE
  {% endif %}

# A Cooldown entry pressed during a print left a 10 h print on a cold bed
# (docs/08). The Temperature list stays for live target changes.
[menu __main __temp __cooldown]
type: list
enable: {printer.print_stats.state not in ["printing", "paused"]}
name: Cooldown

# Additional menu entries for RF2000v2 specific functions
[menu __main __rf2000]
type: list
name: RF2000v2
index: 1

[menu __main __rf2000 __home]
type: command
name: Home all
gcode: G28

[menu __main __rf2000 __mesh]
type: command
name: Heat bed scan
gcode:
  G28
  BED_MESH_CALIBRATE

[menu __main __rf2000 __zoffset]
type: command
name: Z-offset scan
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}G28{% endif %}
  DMS_Z_OFFSET_SCAN

[menu __main __rf2000 __align]
type: command
name: Align extruders
gcode: RF_ALIGN_EXTRUDERS

[menu __main __rf2000 __t0]
type: command
name: Select T0 (left)
gcode: T0

[menu __main __rf2000 __t1]
type: command
name: Select T1 (right)
gcode: T1

[menu __main __rf2000 __rgb]
type: list
name: RGB light

[menu __main __rf2000 __rgb __auto]
type: command
name: Automatic
gcode: RGB_LIGHT MODE=AUTO

[menu __main __rf2000 __rgb __white]
type: command
name: White
gcode: RGB_LIGHT MODE=WHITE

[menu __main __rf2000 __rgb __off]
type: command
name: Off
gcode: RGB_LIGHT MODE=OFF

[menu __main __rf2000 __caselight]
type: input
name: OUT1 lamp: {'%3d' % (menu.input*100)}%
input: {printer["led case_light"].color_data[0][3]}
input_min: 0
input_max: 1
input_step: 0.1
gcode:
  SET_LED LED=case_light WHITE={menu.input}

[menu __main __rf2000 __230v]
type: input
name: 230V out: {'ON ' if menu.input else 'OFF'}
input: {printer["output_pin output_230v"].value}
input_min: 0
input_max: 1
input_step: 1
gcode:
  SET_PIN PIN=output_230v VALUE={menu.input}

[menu __main __rf2000 __fet1]
type: input
name: FET1 X42: {'ON ' if menu.input else 'OFF'}
input: {printer["output_pin fet1_x42"].value}
input_min: 0
input_max: 1
input_step: 1
gcode:
  SET_PIN PIN=fet1_x42 VALUE={menu.input}

[menu __main __rf2000 __fet2]
type: input
name: FET2 X44: {'ON ' if menu.input else 'OFF'}
input: {printer["output_pin fet2_x44"].value}
input_min: 0
input_max: 1
input_step: 1
gcode:
  SET_PIN PIN=fet2_x44 VALUE={menu.input}

[menu __main __rf2000 __silent]
type: command
name: Silent mode toggle
gcode: RF_SILENT_MODE

[menu __main __rf2000 __mode]
type: command
name: {'Mode: MILL' if printer.save_variables.variables.rf_mode|default('print') == 'mill' else 'Mode: PRINT'}
gcode:
  {% if printer.save_variables.variables.rf_mode|default('print') == 'mill' %}
    RF_MODE MODE=PRINT
  {% else %}
    RF_MODE MODE=MILL
  {% endif %}

[menu __main __rf2000 __load]
type: command
name: Load filament
gcode: LOAD_FILAMENT

[menu __main __rf2000 __unload]
type: command
name: Unload filament
gcode: UNLOAD_FILAMENT

[menu __main __rf2000 __estop]
type: command
name: EMERGENCY STOP
gcode: M112

[menu __main __rf2000 __dms]
type: command
name: DMS read
gcode: DMS_READ
