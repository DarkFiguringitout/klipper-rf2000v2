# =====================================================================
#  Renkforce RF2000v2 - hardware definition for Klipper
# =====================================================================
#  Board: Conrad RF2000v2 mainboard, ATmega2560 @ 16 MHz,
#         5x TI DRV8711 stepper pre-drivers (SPI), ADS1110 strain gauge,
#         2x 24C256 EEPROM, HD44780 20x4 LCD, 11 keys.
#
#  Every pin below was cross-checked against both the official Conrad
#  firmware (RF1000/Repetier-Firmware, branch development, RF2000v2/pins.h)
#  and the community firmware (Nibbels/Repetier-Firmware) with
#  tools/verify_pins.py (78/78 pins match).  The Arduino pin numbers of the
#  RF firmware are given in brackets for reference.
#
#  Values marked "(RF fw)" are the factory values of the RF2000v2 firmware.
# =====================================================================

[mcu]
# Run scripts/install.sh or `ls /dev/serial/by-id/*` to find this path
serial: /dev/serial/by-id/REPLACE_ME
baud: 250000
restart_method: arduino

[printer]
kinematics: cartesian
# RF fw: MAX_FEEDRATE 500/500/50 mm/s with double/quad stepping.  Klipper
# on a 16MHz AVR handles ~100k steps/s for X+Y at 32 micro steps, so 300mm/s
# is the practical limit.  Acceleration (RF fw): 1000 mm/s^2.
max_velocity: 300
max_accel: 1000
minimum_cruise_ratio: 0.5
square_corner_velocity: 5.0
max_z_velocity: 10
max_z_accel: 100

# ---------------------------------------------------------------------
#  Motion.  Steps (RF fw): X/Y 4.761875 full steps/mm, Z 80, E 8.
#  rotation_distance = 200 full steps / (full steps per mm)
# ---------------------------------------------------------------------
[stepper_x]
step_pin: PF0                 # STP_DRV1 [54]
dir_pin: !PF1                 # DIR_DRV1 [55], INVERT_X_DIR=true
enable_pin: PD7               # ENA_DRV1 [38], active high
microsteps: 32
rotation_distance: 42.0       # 200 / 4.761875
endstop_pin: ^!PC2            # ES1 [35], low = triggered
# X=0 is the left nozzle (T0) at the left bed border.  The switch sits
# 33.6mm (= T1 offset) further left, exactly like the RF firmware which
# homes to "minSteps - offX" so that both nozzles can reach X=0.
position_endstop: -33.6
position_min: -33.6
# RF fw: X_MAX_LENGTH_PRINT 170 (+ X_MAX_LENGTH_OFFSET 30 left only)
position_max: 200
homing_speed: 80
second_homing_speed: 4        # ENDSTOP_X_RETEST_REDUCTION_FACTOR 20
homing_retract_dist: 5

[stepper_y]
step_pin: PF6                 # STP_DRV2 [60]
dir_pin: PF7                  # DIR_DRV2 [61]
enable_pin: PF2               # ENA_DRV2 [56]
microsteps: 32
rotation_distance: 42.0
endstop_pin: ^!PC0            # ES2 [37]
position_endstop: 0
position_min: 0
position_max: 290             # RF fw: Y_MAX_LENGTH 290
homing_speed: 80
second_homing_speed: 4
homing_retract_dist: 5

[stepper_z]
# The bed moves in Z.  Z=0 is the Z-min switch (ES3, bed up).
step_pin: PF3                 # STP_DRV3 [57]
dir_pin: PL1                  # DIR_DRV3 [48]
enable_pin: PK0               # ENA_DRV3 [62]
microsteps: 32
rotation_distance: 2.5        # 200 / 80
endstop_pin: ^!PC6            # ES3 [31]
position_endstop: 0
# Negative Z is needed for bed mesh corrections and strain gauge probing
# (RF fw allows 3mm drive over: Z_ENDSTOP_DRIVE_OVER).
position_min: -2.0
position_max: 185             # RF fw: Z_MAX_LENGTH 185
homing_speed: 10
second_homing_speed: 0.5
homing_retract_dist: 3.2      # Z_ENDSTOP_MAX_HYSTERESIS + DRIVE_OVER

# ---------------------------------------------------------------------
#  DRV8711 stepper drivers (software SPI, active-high chip selects).
#  torque = DRV8711 TORQUE register (0..255).  Factory currents (RF fw,
#  MOTOR_CURRENT): X 145, Y 140, Z 100, E0 90, E1 90 ("126 = ~2A").
#  The community "normal/quiet" profile is 110/110/105/90/90 - see
#  RF_SILENT_MODE in macros/rf_outputs.cfg.
# ---------------------------------------------------------------------
[drv8711 stepper_x]
cs_pin: PL0                   # SCS_1 [49]
spi_software_sclk_pin: PD5    # SCLK [93]
spi_software_mosi_pin: PD6    # SDATI [94]
spi_software_miso_pin: PD4    # SDATO [92]
spi_speed: 100000
reset_pin: PE7                # RESET_DRV [90], shared by all 5 drivers
torque: 145

[drv8711 stepper_y]
cs_pin: PL2                   # SCS_2 [47]
spi_software_sclk_pin: PD5
spi_software_mosi_pin: PD6
spi_software_miso_pin: PD4
spi_speed: 100000
torque: 140

[drv8711 stepper_z]
cs_pin: PB6                   # SCS_3 [12]
spi_software_sclk_pin: PD5
spi_software_mosi_pin: PD6
spi_software_miso_pin: PD4
spi_speed: 100000
torque: 100

[drv8711 extruder]
cs_pin: PL6                   # SCS_4 [43]
spi_software_sclk_pin: PD5
spi_software_mosi_pin: PD6
spi_software_miso_pin: PD4
spi_speed: 100000
torque: 90

[drv8711 extruder1]
cs_pin: PJ7                   # SCS_5 [84]
spi_software_sclk_pin: PD5
spi_software_mosi_pin: PD6
spi_software_miso_pin: PD4
spi_speed: 100000
torque: 90

# DRV8711 FAULTn [97] is open drain, low on any driver fault
[gcode_button drv8711_fault]
pin: ^!PE6
press_gcode:
  RF_DRIVER_FAULT

# ---------------------------------------------------------------------
#  Thermistors (fitted from the RF fw tables, 4.7k pull-up, see
#  tools/thermistor_from_repetier.py; max error 1.8C = table resolution)
# ---------------------------------------------------------------------
[thermistor RF2000 Conrad V3 Hotend]
# RF fw sensor type 13 "NTC 3950 100k - Conrad V3" (hotend V3)
temperature1: 25
resistance1: 99824
temperature2: 150
resistance2: 1668
temperature3: 250
resistance3: 231

[thermistor RF2000 EPCOS G550]
# RF fw sensor type 3 "mendel-parts EPCOS G550" (heat bed, hotend V1/V2)
temperature1: 20
resistance1: 125249
temperature2: 150
resistance2: 1643
temperature3: 250
resistance3: 221

[thermistor RF2000 NTC 3950 X35]
# RF fw sensor type 14 (optional sensor port X35)
temperature1: 23
resistance1: 109779
temperature2: 150
resistance2: 1959
temperature3: 247
resistance3: 351

# ---------------------------------------------------------------------
#  Extruders.  T0 = left, T1 = right (33.6mm to the right of T0)
# ---------------------------------------------------------------------
[extruder]
step_pin: PA4                 # STP_DRV4 [26]
dir_pin: PA6                  # DIR_DRV4 [28], EXT0_INVERSE=false
enable_pin: PA2               # ENA_DRV4 [24]
microsteps: 32
rotation_distance: 25.0       # 200 / 8 - calibrate with the e-steps guide
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_velocity: 25 # EXT0_MAX_FEEDRATE
max_extrude_only_accel: 6000  # EXT0_MAX_ACCELERATION
heater_pin: PB4               # HZ1 [10]
sensor_pin: PK5               # TH1 (ADC13)
sensor_type: RF2000 Conrad V3 Hotend
# For hotend V1/V2 use:  sensor_type: RF2000 EPCOS G550
pullup_resistor: 4700
pwm_cycle_time: 0.0328        # HEATER_PWM_SPEED 1 = 30.5Hz
control: pid
# RF fw HT4 (hotend V3) values - run PID_CALIBRATE HEATER=extruder TARGET=220
pid_Kp: 98.0
pid_Ki: 0.63
pid_Kd: 132.0
min_temp: 0
max_temp: 275                 # EXTRUDER_MAX_TEMP
min_extrude_temp: 170
pressure_advance: 0.0

[extruder1]
step_pin: PC1                 # STP_DRV5 [36]
dir_pin: !PC3                 # DIR_DRV5 [34], EXT1_INVERSE=true
enable_pin: PC7               # ENA_DRV5 [30]
microsteps: 32
rotation_distance: 25.0
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_velocity: 25
max_extrude_only_accel: 6000
heater_pin: PH6               # HZ2 [9]
sensor_pin: PK6               # TH2 (ADC14)
sensor_type: RF2000 Conrad V3 Hotend
pullup_resistor: 4700
pwm_cycle_time: 0.0328
control: pid
pid_Kp: 98.0
pid_Ki: 0.63
pid_Kd: 132.0
min_temp: 0
max_temp: 275
min_extrude_temp: 170
pressure_advance: 0.0

[heater_bed]
heater_pin: PE2               # HZ3 [91]
sensor_pin: PK7               # TH3 (ADC15)
sensor_type: RF2000 EPCOS G550
pullup_resistor: 4700
pwm_cycle_time: 0.0328
control: pid
# RF fw values - run PID_CALIBRATE HEATER=heater_bed TARGET=60
pid_Kp: 34.0
pid_Ki: 0.015
pid_Kd: 110.0
min_temp: 0
max_temp: 180                 # HEATED_BED_MAX_TEMP

# Optional 4th temperature input X35 (TH4, ADC12).  Only enable when a
# thermistor is connected, otherwise Klipper shuts down (ADC out of range).
#[temperature_sensor X35]
#sensor_pin: PK4
#sensor_type: RF2000 NTC 3950 X35
#pullup_resistor: 4700

[temperature_sensor raspberry_pi]
sensor_type: temperature_host

# ---------------------------------------------------------------------
#  Fans
# ---------------------------------------------------------------------
[fan]
# Part cooling fan OUT2 [27].  RF fw limits the PWM to 90..193 of 255
# (COOLER_PWM_MIN/MAX) - do NOT raise max_power above 0.757.
pin: PA5
cycle_time: 0.0656            # 15.25Hz (RF fw PWM speed option 1)
max_power: 0.757              # 193/255
off_below: 0.10
kick_start_time: 0.100        # COOLER_KICKSTART 100ms

[controller_fan case_fan]
# Case fan on FET3 / X45 [58] (RF fw FEATURE_CASE_FAN, M3120/M3121).
# Runs while steppers or heaters are active.
pin: PF4
idle_timeout: 60
heater: extruder, extruder1, heater_bed
stepper: stepper_x, stepper_y, stepper_z

# ---------------------------------------------------------------------
#  Outputs
# ---------------------------------------------------------------------
[output_pin output_230v]
# 230V switched socket P230 [3] (RF fw M3301).  Off on any shutdown.
pin: PE5
value: 0
shutdown_value: 0

[output_pin fet1_x42]
# 24V FET output OUT3 / X42 [33] (RF fw M3300 P1)
pin: PC4
value: 0
shutdown_value: 0

[output_pin fet2_x44]
# 24V FET output OUT4 / X44 [32] (RF fw M3300 P2)
pin: PC5
value: 0
shutdown_value: 0

[led case_light]
# Case light OUT1 [25]
white_pin: PA3
cycle_time: 0.010
initial_WHITE: 1.0

[led rgb]
# RGB light strip L_RT/L_GN/L_BL [6/7/8], hardware PWM (timer 4)
red_pin: PH3
green_pin: PH4
blue_pin: PH5
hardware_pwm: True
cycle_time: 0.002
initial_RED: 1.0
initial_GREEN: 1.0
initial_BLUE: 1.0

[output_pin beeper]
# On board buzzer BUZ1 [5] (active buzzer, see M300 in macros)
pin: PE3
value: 0
shutdown_value: 0

# Servo outputs (not used on a stock RF2000v2, e.g. for tip-down hotends)
#[servo servo1]
#pin: PL3          # SERVO_1 [46]
#[servo servo2]
#pin: PL4          # SERVO_2 [45]
#[servo servo3]
#pin: PL5          # SERVO_3 [44]

# ---------------------------------------------------------------------
#  External hardware watchdog (TPS3823, WDI = PA7 [29]).
#  Disabled by default: while PA7 is an input the TPS3823 detects the
#  high-impedance WDI and stops supervising (TI datasheet 8.4.2).
#  Klipper already runs the AVR internal watchdog.  If enabled, the pin is
#  toggled while the host is alive; on any Klipper shutdown it stops and the
#  TPS3823 hard-resets the MCU ~1.6s later (the shutdown reason is then
#  reported as "lost communication").
# ---------------------------------------------------------------------
#[pwm_tool rf2000_watchdog]
#pin: PA7
#cycle_time: 0.050
#value: 0.5
#shutdown_value: 0
#maximum_mcu_duration: 1.0

# ---------------------------------------------------------------------
#  Z-max limit switch ES4 [16]: crash protection + milling mode homing
# ---------------------------------------------------------------------
[rf2000_zmax]
pin: ^!PH1
homing_speed: 10
second_homing_speed: 1
homing_retract_dist: 2
leave_distance: 2             # LEAVE_Z_MAX_ENDSTOP_AFTER_HOME
monitor: True

[idle_timeout]
timeout: 1800

[pause_resume]

[exclude_object]

[gcode_arcs]
resolution: 0.5

[respond]

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[display_status]

[save_variables]
filename: ~/printer_data/config/rf2000v2_variables.cfg

[force_move]
enable_force_move: True

[firmware_retraction]
retract_length: 1.0
retract_speed: 40
unretract_speed: 30
