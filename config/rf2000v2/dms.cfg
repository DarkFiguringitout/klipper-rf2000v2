# =====================================================================
#  RF2000v2 strain gauge ("DMS"), bed mesh and RF EEPROM
# =====================================================================

[rf2000_dms]
# ADS1110 on the I2C bus X34 (SCL=PD0, SDA=PD1, AVR TWI), address 0x49
i2c_mcu: mcu
i2c_bus: twi
i2c_address: 73               # 0x49 (I2C_ADDRESS_STRAIN_GAUGE)
i2c_speed: 100000
adc_type: ads1110
adc_config: 0x8C              # continuous, 16 bit, gain 1 (RF fw)
# The nozzle itself is the probe
z_offset: 0.0
# Probing (RF fw heat bed scan defaults)
speed: 0.5                    # fast approach mm/s (overtravel ~0.1mm)
slow_speed: 0.05              # precise approach mm/s
lift_speed: 5.0
samples: 1
sample_retract_dist: 0.3
samples_tolerance: 0.020
samples_tolerance_retries: 2
contact_delta: 10             # HEAT_BED_SCAN_CONTACT_PRESSURE_DELTA
contact_samples: 2            # consecutive samples beyond contact_delta
max_contact_digits: 5000      # abort if the overtravel force is higher
release_delta: 5              # HEAT_BED_SCAN_RETRY_PRESSURE_DELTA
idle_samples: 5
idle_tolerance: 15            # HEAT_BED_SCAN_PRESSURE_TOLERANCE
idle_min: -7500               # HEAT_BED_SCAN_IDLE_PRESSURE_MIN
idle_max: 7500                # HEAT_BED_SCAN_IDLE_PRESSURE_MAX
backoff_distance: 0.15
release_distance: 0.10
# Emergency pause while printing (RF fw EMERGENCY_PAUSE_DIGITS +-15000)
emergency_pause_digits_min: -15000
emergency_pause_digits_max: 15000
emergency_pause_checks: 10
pause_gcode: PAUSE
# Emergency stop when Z is blocked (RF fw EMERGENCY_STOP_DIGITS +-5000)
emergency_stop_digits_min: -5000
emergency_stop_digits_max: 5000
emergency_stop_checks: 3
monitor_interval: 0.100
monitor: True
# SenseOffset (M3909) limits
sense_offset_max: 0.180
sense_offset_max_height: 0.30
# Closed loop pressure control (DMS_PRESSURE_CONTROL) - 0 = off.
# Find a good target with DMS_VISCOSITY_TEST.
pressure_control_target: 0
pressure_control_mode: speed  # speed | flow | both
pressure_control_kp: 0.5
pressure_control_ki: 0.2
pressure_control_min_speed: 50
pressure_control_min_flow: 100
flow_compensation_min_height: 0.30
rf_gcode_aliases: True

[rf2000_eeprom]
# 24C256 with the RF firmware heat bed scan matrices (0x50)
i2c_mcu: mcu
i2c_bus: twi
i2c_address: 80
z_full_steps_per_mm: 80

[bed_mesh]
# Equivalent of the RF heat bed scan (HBS) grid for two extruders:
# X 0..170 (scan positions of T0), Y 30mm from the front .. 5mm from back
speed: 80
horizontal_move_z: 1.5        # HEAT_BED_SCAN_Z_START_MM is 1.0
mesh_min: 5, 30
mesh_max: 165, 280
probe_count: 9, 13
algorithm: bicubic
bicubic_tension: 0.2
mesh_pps: 2, 2
# RF fw: full compensation below 0.33mm, faded out until 10mm
fade_start: 0.33
fade_end: 10.0
split_delta_z: 0.025
move_check_distance: 5

[screws_tilt_adjust]
# Bed leveling screw positions (nozzle T0 coordinates).  MEASURE your bed
# and correct these before using SCREWS_TILT_CALCULATE; also set
# screw_thread to the thread of your leveling screws.
screw1: 15, 35
screw1_name: front left
screw2: 155, 35
screw2_name: front right
screw3: 85, 270
screw3_name: back center
horizontal_move_z: 3
speed: 80
screw_thread: CW-M4
