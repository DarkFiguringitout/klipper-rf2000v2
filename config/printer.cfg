# =====================================================================
#  Renkforce RF2000v2 - Klipper configuration (klipper-rf2000v2)
#  https://github.com/DarkFiguringitout/klipper-rf2000v2
# =====================================================================
#  The RF2000v2 specific files live in rf2000v2/.  Put your own changes
#  below the includes (later sections override earlier ones), so updates
#  of the rf2000v2/ directory never overwrite them.
#
#  First start checklist (docs/04-first-start.md):
#    1. set [mcu] serial below (scripts/install.sh does this for you)
#    2. FIRMWARE_RESTART, check DRV_STATUS_ALL and DMS_TEST
#    3. home (G28), check every axis direction and endstop (QUERY_ENDSTOPS)
#    4. PID_CALIBRATE for extruder, extruder1 and heater_bed
#    5. BED_MESH_CALIBRATE (or RF_IMPORT_HBS), RF_ALIGN_EXTRUDERS
#    6. SAVE_CONFIG
# =====================================================================

[include rf2000v2/hardware.cfg]
[include rf2000v2/dms.cfg]
[include rf2000v2/display.cfg]
[include rf2000v2/macros/*.cfg]

# ---- your overrides -------------------------------------------------
[mcu]
serial: /dev/serial/by-id/REPLACE_ME

#[extruder]
#rotation_distance: 25.0
#pressure_advance: 0.05

# Milling: RF_MODE MODE=MILL / MODE=PRINT

