# =====================================================================
#  Renkforce RF2000v2 - Klipper configuration (klipper-rf2000v2)
#  https://github.com/DarkFiguringitout/klipper-rf2000v2
# =====================================================================
#  The RF2000v2 specific files live in rf2000v2/.  Put your own changes
#  below the includes (later sections override earlier ones), so updates
#  of the rf2000v2/ directory never overwrite them.
#
#  First start checklist (docs/04-first-start.md):
#    1. set [mcu] serial below (scripts/install.sh does this for you)
#    2. FIRMWARE_RESTART, check DRV_STATUS_ALL and DMS_TEST
#    3. home (G28), check every axis direction and endstop (QUERY_ENDSTOPS)
#    4. PID_CALIBRATE for extruder, extruder1 and heater_bed
#    5. BED_MESH_CALIBRATE (or RF_IMPORT_HBS), RF_ALIGN_EXTRUDERS
#    6. SAVE_CONFIG
# =====================================================================

[include rf2000v2/hardware.cfg]
[include rf2000v2/dms.cfg]
[include rf2000v2/display.cfg]
[include rf2000v2/macros/*.cfg]

# ---- your settings and overrides -----------------------------------
[mcu]
serial: /dev/serial/by-id/REPLACE_ME

# The following options are written by Klipper's calibration commands and
# SAVE_CONFIG, so they must live in this file (not in the rf2000v2/ includes).
# After SAVE_CONFIG the values here are commented out and the calibrated
# values appear in the SAVE_CONFIG block at the end.

[stepper_z]
position_endstop: 0           # Z_ENDSTOP_CALIBRATE

[rf2000_dms]
z_offset: 0.0                 # PROBE_CALIBRATE / Z_OFFSET_APPLY_PROBE

[extruder]
# RF fw HT4 (hotend V3) start values - run PID_CALIBRATE HEATER=extruder TARGET=220
control: pid
pid_Kp: 98.0
pid_Ki: 0.63
pid_Kd: 132.0

[extruder1]
# PID_CALIBRATE HEATER=extruder1 TARGET=220
control: pid
pid_Kp: 98.0
pid_Ki: 0.63
pid_Kd: 132.0

[heater_bed]
# RF fw start values - run PID_CALIBRATE HEATER=heater_bed TARGET=60
control: pid
pid_Kp: 34.0
pid_Ki: 0.015
pid_Kd: 110.0

# Examples:
#[extruder]
#rotation_distance: 25.0
#pressure_advance: 0.05

# Milling: RF_MODE MODE=MILL / MODE=PRINT

#*# <---------------------- SAVE_CONFIG ---------------------->
#*# DO NOT EDIT THIS BLOCK OR BELOW. The contents are auto-generated.
#*#
